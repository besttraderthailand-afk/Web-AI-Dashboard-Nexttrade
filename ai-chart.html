<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NexxTrade — TradingView</title>
<style>
:root { --bg:#090d16; --panel:#101827; --line:#2a364a; --txt:#e8eef7; --dim:#8b97ab; --gold:#d4b03a; --chip:#1c2738; }
html, body { margin:0; height:100%; font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--txt); }
.wrap { max-width:1100px; margin:0 auto; padding:14px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }
.asset-bar, .tf-bar { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
.asset-bar button, .tf-bar button {
  background:var(--chip); color:var(--dim); border:1px solid var(--line);
  border-radius:999px; padding:5px 10px; cursor:pointer; font:12px inherit;
}
.asset-bar button.on { color:#111; background:var(--gold); border-color:var(--gold); }
.tf-bar button.on { color:var(--txt); border-color:var(--gold); }
.row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
#tvHost { height:520px; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.muted { color:var(--dim); }
a { color:#f0d27a; }
</style>
</head>
<body>
<div class="wrap">
  <p class="muted"><a href="index.html#ai">← แดชบอร์ด v1</a> · TradingView สดสด · คริปโตติ้หมายเลย์ v2</p>
  <div class="card">
    <div class="asset-bar" id="assetBar"></div>
    <div class="row">
      <h2 id="chartTitle" style="margin:0">XAUUSD · M15</h2>
      <div class="tf-bar" id="tfBar"></div>
    </div>
    <p class="muted" id="chartMeta"></p>
    <div id="tvHost"></div>
  </div>
</div>
<script src="chart-assets.js"></script>
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
const ASSETS = window.NEXX_ASSETS || [
  { id: "XAUUSD", group: "metal", label: "ทอง", venue: "v1", tv: "OANDA:XAUUSD" }
];
const TFS = ["M1", "M5", "M15", "H1"];
const TFMAP = window.NEXX_TF_TO_TV || { M1: "1", M5: "5", M15: "15", H1: "60" };
let currentAsset = ASSETS[0];
let currentTf = "M15";
let tvWidget = null;

function mountTv() {
  const host = document.getElementById("tvHost");
  host.innerHTML = "";
  const node = document.createElement("div");
  node.id = "tvframe";
  node.style.height = "100%";
  host.appendChild(node);
  tvWidget = new TradingView.widget({
    autosize: true,
    symbol: currentAsset.tv || currentAsset.id,
    interval: TFMAP[currentTf] || "15",
    timezone: "Asia/Bangkok",
    theme: "dark",
    style: "1",
    locale: "th_TH",
    toolbar_bg: "#101827",
    enable_publishing: false,
    hide_top_toolbar: false,
    hide_legend: false,
    save_image: false,
    container_id: "tvframe",
    studies: ["MASimple@tv-basicstudies"]
  });
}

function paintChrome() {
  const a = currentAsset;
  document.getElementById("chartTitle").textContent = a.id + " · " + currentTf;
  document.getElementById("chartMeta").textContent =
    a.label + " · " + a.group + " · " + (a.tv || a.id) + " · สิทธิ์ " + a.venue +
    (a.venue === "v2" ? " (ต้องมีใบ MEM_V2)" : "");
  const bar = document.getElementById("assetBar");
  bar.innerHTML = ASSETS.map((x) =>
    `<button type="button" class="${x.id === a.id ? "on" : ""}" data-id="${x.id}">${x.id}</button>`
  ).join("");
  bar.querySelectorAll("button").forEach((b) => {
    b.onclick = () => {
      currentAsset = ASSETS.find((x) => x.id === b.dataset.id);
      paintChrome();
      mountTv();
    };
  });
  const tf = document.getElementById("tfBar");
  tf.innerHTML = TFS.map((t) =>
    `<button type="button" class="${t === currentTf ? "on" : ""}" data-tf="${t}">${t}</button>`
  ).join("");
  tf.querySelectorAll("button").forEach((b) => {
    b.onclick = () => {
      currentTf = b.dataset.tf;
      paintChrome();
      mountTv();
    };
  });
}

function boot() {
  if (typeof TradingView === "undefined") {
    document.getElementById("tvHost").innerHTML =
      '<p class="muted" style="padding:16px">โหลด TradingView ไม่ได้ ตรวจสัญญาณอนุญาตให้ s3.tradingview.com</p>';
    paintChrome();
    return;
  }
  paintChrome();
  mountTv();
}

if (document.readyState === "complete") boot();
else window.addEventListener("load", boot);
</script>
</body>
</html>
